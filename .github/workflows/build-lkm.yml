name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      manager_package:
        description: 'manager package name'
        required: false
        default: ''
        type: string
      expected_manager_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_manager_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      manager_package:
        description: 'manager package name'
        required: false
        default: 'com.senseisu.ssu'
        type: string
      expected_manager_size:
        description: 'expected signature size'
        required: false
        default: '0x308'
        type: string
      expected_manager_hash:
        description: 'expected signature hash'
        required: false
        default: 'd09bd720221f30816788eb1e1979af3a8514041da86d8032df75b2cd2ef9cd7c'
        type: string
jobs:
  build-lkm-ksu:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-ksu.yml
    with:
      kmi: ${{ matrix.kmi }}
      manager_package: ${{ inputs.manager_package }}
      expected_manager_size: ${{ inputs.expected_manager_size }}
      expected_manager_hash: ${{ inputs.expected_manager_hash }}
  
  build-lkm-susfs:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-susfs.yml
    with:
      kmi: ${{ matrix.kmi }}
